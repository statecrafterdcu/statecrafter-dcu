<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Forgot Password | StateCrafter DCU
  </title>


  <link
    rel="stylesheet"
    href="../style.css"
  >


  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    .forgot-page {

      min-height:
        calc(100vh - 82px);

      display:grid;

      place-items:center;

      padding:50px 20px;

      background:
        linear-gradient(
          135deg,
          #f7f5f0 0%,
          #ffffff 55%,
          #eef2f8 100%
        );

    }


    .forgot-card {

      width:
        min(460px,100%);

      background:#fff;

      border:
        1px solid var(--line);

      border-radius:24px;

      padding:36px;

      box-shadow:
        0 20px 60px
        rgba(18,43,82,.10);

    }


    .forgot-logo {

      display:flex;

      justify-content:center;

      margin-bottom:20px;

    }


    .forgot-logo img {

      width:115px;

      height:115px;

      object-fit:contain;

    }


    .forgot-heading {

      text-align:center;

      margin-bottom:28px;

    }


    .forgot-heading h1 {

      margin:0;

      color:var(--navy);

      font-size:32px;

      line-height:1.1;

    }


    .forgot-heading p:not(.eyebrow) {

      margin:10px 0 0;

      color:var(--muted);

      font-size:13px;

    }


    .forgot-form {

      display:grid;

      gap:16px;

    }


    .forgot-form label {

      color:var(--navy);

      font-size:12px;

      font-weight:800;

    }


    .forgot-form input {

      width:100%;

      height:48px;

      margin-top:7px;

      border:
        1px solid #d8dde5;

      border-radius:11px;

      padding:0 13px;

      font:inherit;

      font-size:14px;

      outline:none;

    }


    .forgot-form input:focus {

      border-color:var(--navy);

      box-shadow:
        0 0 0 3px
        rgba(18,43,82,.07);

    }


    .forgot-button {

      width:100%;

      min-height:50px;

      cursor:pointer;

    }


    .forgot-button:disabled {

      opacity:.65;

      cursor:not-allowed;

    }


    .message {

      min-height:20px;

      text-align:center;

      font-size:12px;

      line-height:1.5;

    }


    .message.error {

      color:var(--red);

    }


    .message.success {

      color:#27703a;

    }


    .back-login {

      display:block;

      text-align:center;

      margin-top:20px;

      color:var(--red);

      font-size:12px;

      font-weight:800;

    }


    @media(max-width:560px) {

      .forgot-page {

        padding:30px 14px;

      }


      .forgot-card {

        padding:25px 20px;

      }


      .forgot-heading h1 {

        font-size:28px;

      }

    }

  </style>

</head>


<body>


<header class="site-header">

  <div class="container nav-wrap">


    <a
      class="brand"
      href="../index.html"
    >

      <img
        src="../assets/statecrafter-logo.png"
        alt="StateCrafter DCU"
      >


      <span class="brand-copy">

        <strong>
          StateCrafter DCU
        </strong>

        <small>
          Political Science Department
        </small>

      </span>

    </a>


    <nav class="nav">

      <a href="../index.html">
        Home
      </a>

      <a href="archive.html">
        Academic Archive
      </a>

      <a href="about.html">
        About
      </a>

      <a
        href="login.html"
        class="nav-login"
      >
        Sign In
      </a>

    </nav>


    <button
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
    >
      ☰
    </button>

  </div>

</header>



<main class="forgot-page">


  <div class="forgot-card">


    <div class="forgot-logo">

      <img
        src="../assets/statecrafter-logo.png"
        alt="StateCrafter DCU"
      >

    </div>


    <div class="forgot-heading">

      <p class="eyebrow">
        ACCOUNT RECOVERY
      </p>

      <h1>
        Forgot Password?
      </h1>

      <p>
        Enter your registered email address
        and we will send you a password reset link.
      </p>

    </div>



    <form
      id="forgotForm"
      class="forgot-form"
    >


      <div>

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="your@email.com"
          autocomplete="email"
          required
        >

      </div>


      <button
        id="resetButton"
        type="submit"
        class="btn btn-primary forgot-button"
      >
        Send Reset Link
      </button>


      <p
        id="message"
        class="message"
        aria-live="polite"
      ></p>


    </form>


    <a
      href="login.html"
      class="back-login"
    >
      ← Back to Sign In
    </a>


  </div>

</main>



<footer class="site-footer">

  <div class="container footer-bottom">

    <span>
      © 2026 StateCrafter DCU
    </span>

    <span>
      Political Science Department • Dhaka Central University
    </span>

  </div>

</footer>



<script src="../auth.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  function() {


    const form =
      document.getElementById(
        "forgotForm"
      );


    const email =
      document.getElementById(
        "email"
      );


    const button =
      document.getElementById(
        "resetButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const emailValue =
          email.value
            .trim()
            .toLowerCase();


        if (!emailValue) {

          showMessage(
            "Please enter your email address.",
            "error"
          );

          email.focus();

          return;

        }


        button.disabled =
          true;

        button.textContent =
          "Sending...";


        showMessage(
          "Sending password reset link...",
          ""
        );


        try {


          /*
           * After clicking the email link,
           * Supabase will return the user
           * to update-password.html
           */

          const redirectUrl =
            window.location.origin +
            "/pages/update-password.html";


          const {
            error
          } =
            await supabaseClient.auth
              .resetPasswordForEmail(
                emailValue,
                {
                  redirectTo:
                    redirectUrl
                }
              );


          if (error) {

            throw error;

          }


          /*
           * Don't reveal whether an email
           * exists in the system.
           */

          showMessage(
            "If an account exists for this email, a password reset link has been sent. Please check your inbox.",
            "success"
          );


          form.reset();


        } catch (error) {

          console.error(
            "Password reset error:",
            error
          );


          showMessage(
            error.message ||
            "Unable to send reset link. Please try again.",
            "error"
          );


        } finally {

          button.disabled =
            false;

          button.textContent =
            "Send Reset Link";

        }

      }
    );


    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "message";

      if (type) {

        message.classList.add(
          type
        );

      }

    }

  }

);

</script>


</body>

</html>
