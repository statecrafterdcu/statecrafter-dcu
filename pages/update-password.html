<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    Set New Password | StateCrafter DCU
  </title>

  <link
    rel="stylesheet"
    href="../style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <style>

    .password-page {

      min-height:
        calc(100vh - 82px);

      display:grid;

      place-items:center;

      padding:50px 20px;

      background:
        linear-gradient(
          135deg,
          #f7f5f0,
          #fff,
          #eef2f8
        );

    }


    .password-card {

      width:
        min(460px,100%);

      background:#fff;

      border:
        1px solid var(--line);

      border-radius:24px;

      padding:36px;

      box-shadow:
        0 20px 60px
        rgba(18,43,82,.10);

    }


    .password-card h1 {

      margin:0;

      color:var(--navy);

      font-size:30px;

    }


    .password-card p {

      color:var(--muted);

      font-size:13px;

    }


    .password-form {

      display:grid;

      gap:16px;

      margin-top:25px;

    }


    .password-form label {

      color:var(--navy);

      font-size:12px;

      font-weight:800;

    }


    .password-form input {

      width:100%;

      height:48px;

      margin-top:7px;

      border:
        1px solid #d8dde5;

      border-radius:11px;

      padding:0 13px;

      font:inherit;

      outline:none;

    }


    .password-form input:focus {

      border-color:var(--navy);

    }


    .password-form button {

      width:100%;

      min-height:50px;

      cursor:pointer;

    }


    .password-message {

      min-height:20px;

      text-align:center;

      font-size:12px;

    }


    .password-message.error {

      color:var(--red);

    }


    .password-message.success {

      color:#27703a;

    }

  </style>

</head>


<body>


<header class="site-header">

  <div class="container nav-wrap">

    <a
      class="brand"
      href="../index.html"
    >

      <img
        src="../assets/statecrafter-logo.png"
        alt="StateCrafter DCU"
      >

      <span class="brand-copy">

        <strong>
          StateCrafter DCU
        </strong>

        <small>
          Political Science Department
        </small>

      </span>

    </a>

  </div>

</header>



<main class="password-page">


  <div class="password-card">


    <p class="eyebrow">
      ACCOUNT RECOVERY
    </p>


    <h1>
      Set New Password
    </h1>


    <p>
      Create a new password for your
      StateCrafter DCU account.
    </p>


    <form
      id="passwordForm"
      class="password-form"
    >


      <div>

        <label for="password">
          New Password
        </label>

        <input
          type="password"
          id="password"
          minlength="6"
          autocomplete="new-password"
          required
        >

      </div>


      <div>

        <label for="confirmPassword">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirmPassword"
          minlength="6"
          autocomplete="new-password"
          required
        >

      </div>


      <button
        id="updateButton"
        type="submit"
        class="btn btn-primary"
      >
        Update Password
      </button>


      <p
        id="message"
        class="password-message"
        aria-live="polite"
      ></p>


    </form>

  </div>

</main>



<script src="../auth.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  async function() {


    const form =
      document.getElementById(
        "passwordForm"
      );


    const password =
      document.getElementById(
        "password"
      );


    const confirmPassword =
      document.getElementById(
        "confirmPassword"
      );


    const button =
      document.getElementById(
        "updateButton"
      );


    const message =
      document.getElementById(
        "message"
      );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const newPassword =
          password.value;


        const confirm =
          confirmPassword.value;


        if (
          newPassword.length < 6
        ) {

          showMessage(
            "Password must be at least 6 characters.",
            "error"
          );

          return;

        }


        if (
          newPassword !== confirm
        ) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        button.disabled =
          true;

        button.textContent =
          "Updating...";


        try {


          const {
            error
          } =
            await supabaseClient.auth
              .updateUser({
                password:
                  newPassword
              });


          if (error) {

            throw error;

          }


          showMessage(
            "Password updated successfully. Redirecting to Sign In...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "login.html";

            },
            1800
          );


        } catch (error) {

          console.error(
            "Update password error:",
            error
          );


          showMessage(
            error.message ||
            "Could not update password.",
            "error"
          );


          button.disabled =
            false;

          button.textContent =
            "Update Password";

        }

      }
    );


    function showMessage(
      text,
      type
    ) {

      message.textContent =
        text;

      message.className =
        "password-message " +
        (type || "");

    }

  }

);

</script>


</body>

</html>
